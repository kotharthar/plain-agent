[project]
name = "mini_agent"
version = "0.1.0"
description = "Tiny ReAct-style AI agent — no framework, just a while loop."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7"]

[project.scripts]
mini-agent = "mini_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mini_agent*"]
